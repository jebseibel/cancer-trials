# /etc/nginx/sites-available/breastcancertrialfinder.com
#
# One more server block on a box that already fronts eight sites. Nothing here touches them:
# nginx routes on server_name, so this block only ever sees requests for this domain.
#
# certbot --nginx rewrites this file in place to add the 443 block and the HTTP redirect.

server {
    listen 80;
    server_name breastcancertrialfinder.com www.breastcancertrialfinder.com;

    # The SPA is bundled inside the jar and served by Spring, so nginx proxies everything and
    # serves no files of its own. There is deliberately no root/try_files here - a root would
    # shadow the app with an empty directory.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # OVERWRITE rather than append. The house style uses $proxy_add_x_forwarded_for, which
        # appends to whatever the client sent - and LoginRateLimitFilter keys its lockout on the
        # first hop of this header. Appending would let a caller forge a leading address and get
        # a fresh rate-limit bucket per request, defeating the throttle on the one endpoint that
        # is unauthenticated by necessity.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ingestion and backfill run for minutes to hours - a full corpus pull is ~14 minutes and
    # the embedding backfill is hours on this 1-vCPU box. nginx's 60s default kills both, and
    # the failure looks like an application error rather than a proxy timeout.
    #
    # Scoped to these two paths on purpose: a genuinely hung request anywhere else should still
    # fail fast rather than hold a worker for four hours.
    location ~ ^/api/(ingestion|rag/backfill) {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
    }

    # Trial criteria and the ranked-assessment payload are large; 50m matches the other sites.
    client_max_body_size 50m;
}
