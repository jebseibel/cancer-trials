databaseChangeLog:
  - changeSet:
      id: create_lab_result_table
      author: jeb
      labels: uchealth
      changes:

        # LabResult Table - normalized from FHIR R4 Observation (laboratory category)
        - createTable:
            tableName: lab_result
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: extid, type: varchar(36), constraints: { nullable: false, unique: true }, defaultValueComputed: "(UUID())" }
              - column: { name: fhir_resource_id, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: test_name, type: varchar(500), constraints: { nullable: false } }
              - column: { name: loinc_code, type: varchar(32) }
              - column: { name: status, type: varchar(32) }
              - column: { name: category, type: varchar(64) }
              - column: { name: effective_at, type: datetime }
              - column: { name: issued_at, type: datetime }
              - column: { name: value_quantity, type: "decimal(18,6)" }
              - column: { name: value_unit, type: varchar(64) }
              - column: { name: value_string, type: varchar(1000) }
              - column: { name: interpretation, type: varchar(128) }
              - column: { name: reference_range_low, type: "decimal(18,6)" }
              - column: { name: reference_range_high, type: "decimal(18,6)" }
              - column: { name: reference_range_text, type: varchar(255) }
              - column: { name: is_panel, type: "tinyint(1)" }
              - column: { name: display_text, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: datetime, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: datetime }
              - column: { name: deleted_at, type: datetime }
              - column: { name: active, type: int, defaultValueNumeric: 1 }

        - createIndex:
            tableName: lab_result
            indexName: idx_lab_result_loinc_code
            columns:
              - column: { name: loinc_code }

        - createIndex:
            tableName: lab_result
            indexName: idx_lab_result_effective_at
            columns:
              - column: { name: effective_at }
