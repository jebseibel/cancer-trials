databaseChangeLog:
  - changeSet:
      id: create_job_posting_table
      author: jeb
      labels: create_job_search_tables
      changes:

        # Job Posting Table
        - createTable:
            tableName: job_posting
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: extid, type: varchar(36), constraints: { nullable: false, unique: true }, defaultValueComputed: "(UUID())" }
              - column: { name: title, type: varchar(255), constraints: { nullable: false } }
              - column: { name: company_id, type: bigint, constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column: { name: city, type: varchar(120) }
              - column: { name: state, type: varchar(120) }
              - column: { name: country, type: varchar(120) }
              - column: { name: work_mode, type: varchar(32) }
              - column: { name: salary_min, type: int }
              - column: { name: salary_max, type: int }
              - column: { name: salary_currency, type: varchar(8) }
              - column: { name: source, type: varchar(32), constraints: { nullable: false } }
              - column: { name: source_url, type: varchar(1024), constraints: { nullable: false, unique: true } }
              - column: { name: posted_at, type: datetime }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: notes, type: TEXT }
              - column: { name: created_at, type: datetime, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: datetime }
              - column: { name: deleted_at, type: datetime }
              - column: { name: active, type: int, defaultValueNumeric: 1 }
