databaseChangeLog:
  - changeSet:
      id: create_location_table
      author: jeb
      labels: locations
      changes:

        # Location Table
        - createTable:
            tableName: location
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: extid, type: varchar(36), constraints: { nullable: false, unique: true }, defaultValueComputed: "(UUID())" }
              - column: { name: trial_id, type: bigint, constraints: { nullable: false } }
              - column: { name: facility, type: varchar(255) }
              - column: { name: city, type: varchar(128) }
              - column: { name: state, type: varchar(128) }
              - column: { name: zip, type: varchar(16) }
              - column: { name: country, type: varchar(128) }
              - column: { name: status, type: varchar(32) }
              - column: { name: latitude, type: decimal(9,6) }
              - column: { name: longitude, type: decimal(9,6) }
              - column: { name: created_at, type: datetime, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: datetime }
              - column: { name: deleted_at, type: datetime }
              - column: { name: active, type: int, defaultValueNumeric: 1 }
