databaseChangeLog:
  - changeSet:
      id: create_application_table
      author: jeb
      labels: create_job_search_tables
      changes:

        # Application Table
        - createTable:
            tableName: application
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: extid, type: varchar(36), constraints: { nullable: false, unique: true }, defaultValueComputed: "(UUID())" }
              - column: { name: job_posting_id, type: bigint, constraints: { nullable: false } }
              - column: { name: date_applied, type: date, constraints: { nullable: false } }
              - column: { name: resume_version, type: varchar(120) }
              - column: { name: application_status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: notes, type: TEXT }
              - column: { name: created_at, type: datetime, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: datetime }
              - column: { name: deleted_at, type: datetime }
              - column: { name: active, type: int, defaultValueNumeric: 1 }
