databaseChangeLog:
  - changeSet:
      id: create_eligibility_rule_table
      author: jeb
      labels: eligibility-rules
      changes:

        # EligibilityRule Table
        - createTable:
            tableName: eligibility_rule
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: extid, type: varchar(36), constraints: { nullable: false, unique: true }, defaultValueComputed: "(UUID())" }
              - column: { name: trial_id, type: bigint, constraints: { nullable: false } }
              - column: { name: parent_rule_id, type: bigint }
              - column: { name: node_type, type: varchar(8), constraints: { nullable: false } }
              - column: { name: operator, type: varchar(8) }
              - column: { name: criterion_type, type: varchar(16) }
              - column: { name: criterion_id, type: bigint }
              - column: { name: requirement_type, type: varchar(16) }
              - column: { name: sort_order, type: int, constraints: { nullable: false } }
              - column: { name: notes, type: text }
              - column: { name: created_at, type: datetime, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: datetime }
              - column: { name: deleted_at, type: datetime }
              - column: { name: active, type: int, defaultValueNumeric: 1 }
