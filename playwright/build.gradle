plugins {
    id 'java'
    id 'application'
}

group = 'com.seibel.cancer'
version = '0.0.1-SNAPSHOT'
description = 'MyChart scraper - supplements the Epic FHIR path for categories the patient API does not expose'

java {
    toolchain {
        // 21 to match the rest of this repo (viro-playwright used 17).
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.playwright:playwright:1.47.0'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    // Lombok (compile-time only)
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Logging - Slf4j needs a backend
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

application {
    mainClass = 'com.seibel.cancer.scraper.MyChartScraperApp'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Convenience: `./gradlew installBrowsers` after a fresh clone.
tasks.register('installBrowsers', JavaExec) {
    group = 'application'
    description = 'Downloads the Playwright browser binaries (~300MB, one time).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}
